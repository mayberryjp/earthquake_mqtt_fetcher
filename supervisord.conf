[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:discovery]
command=python -m earthquake_mqtt_fetcher.discovery
directory=/app
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:json_worker]
command=python -m earthquake_mqtt_fetcher.workers.json_worker
directory=/app
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:atom_worker]
command=python -m earthquake_mqtt_fetcher.workers.atom_worker
directory=/app
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
